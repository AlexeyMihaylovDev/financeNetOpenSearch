[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name         forward
    Listen       0.0.0.0
    Port         24224

[OUTPUT]
    Name            opensearch
    Match           *
    Host            opensearch-node
    Port            9200
    Index           logs-$tag-%Y.%m.%d
    Suppress_Type_Name On
    Logstash_Format On
    Logstash_Prefix logs-$tag
